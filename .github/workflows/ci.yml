name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  MAVEN_ARGS: >-
    -s .github/maven-settings.xml
    -Daether.connector.connectTimeout=15000 -Daether.connector.requestTimeout=30000
    -Dmaven.wagon.http.connectionTimeout=15000 -Dmaven.wagon.http.readTimeout=30000

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test
        run: mvn -B clean test
      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/**

  build:
    name: Package JAR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Package (skip tests)
        run: mvn -B -DskipTests package
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: keycloak-krb-probe
          path: target/keycloak-krb-probe.jar
